<section class="contact"> <!--Contact section-->
  <h1>Contact Me</h1>
    <p>Feel free to reach out to me with any questions, comments, or concerns. I will get back to you as soon as possible.</p>
      <form action="https://formsubmit.co/dhyink@hcc-nd.edu" method="POST">    
  <!--Name box-->
        <label for="name">Name:</label> 
        <input type="text" id="name" name="name" required><br><br>
  <!--Email box-->
        <label for="email">Email:</label> 
        <input type="email" id="email" name="email" required><br><br>
  <!--Subject Line-->
        <input type="hidden" name="_subject" value="New submission!">
  <!--Message Box-->
        <label for="message">Message:</label><br> 
        <textarea id="message" name="message" rows="5" cols="30" required></textarea> <br><br>
  <!--next page-->
        <input type="hidden" name="_next" value="https://daemonh1.github.io/thankyouforcontact.html"> 
  <!--submit button-->
        <button type="submit">Submit</button>
    </form>
</section> <!--End of Contact section-->
